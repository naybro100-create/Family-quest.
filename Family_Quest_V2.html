<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Quest V2</title><style>body{font-family:Arial;background:#eef2ff;margin:0;padding:12px} .card{background:#fff;border-radius:12px;padding:12px;margin:10px 0;box-shadow:0 2px 6px rgba(0,0,0,.1)} button{padding:8px 12px;background:#4f46e5;color:#fff;border:0;border-radius:8px;margin:4px} .hidden{display:none}</style></head><body><h1>🎮 Family Quest V2</h1><div class='card'><h3>Player</h3><div>Level <span id=lvl>1</span> | XP <span id=xp>0</span> | Coins <span id=coins>0</span></div></div><div class='card'><h3>🧹 Chores</h3><button onclick='award(10,5)'>Make Bed</button><button onclick='award(20,10)'>Clean Room</button></div><div class='card'><h3>📚 Learning Games</h3><button onclick='showGame("math")'>Math Monster</button><button onclick='showGame("flags")'>Flag Quiz</button><button onclick='showGame("spelling")'>Spelling Challenge</button></div><div id='math' class='card hidden'><h3>🧮 Math Monster</h3><p>Solve: <span id=q></span></p><input id=ans><button onclick='checkMath()'>Attack Monster</button><p id=mmsg></p></div><div id='flags' class='card hidden'><h3>🌏 Flag Quiz</h3><p>🇯🇵 Which country?</p><button onclick='flag(false)'>China</button><button onclick='flag(true)'>Japan</button><button onclick='flag(false)'>Vietnam</button><p id=fmsg></p></div><div id='spelling' class='card hidden'><h3>🔤 Spelling</h3><p>Spell: elephant</p><input id=spell><button onclick='checkSpell()'>Submit</button><p id=smsg></p></div><script>let xp=0,coins=0,a=7,b=8;function render(){xpEl.textContent=xp;coinsEl.textContent=coins;lvl.textContent=Math.floor(xp/100)+1;}function award(x,c){xp+=x;coins+=c;render();}const xpEl=document.getElementById('xp'),coinsEl=document.getElementById('coins');function showGame(id){['math','flags','spelling'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='math'){document.getElementById('q').textContent=a+' x '+b;}}function checkMath(){if(Number(ans.value)===a*b){award(25,10);mmsg.textContent='Monster defeated! +25 XP';}else{mmsg.textContent='Try again';}}function flag(ok){if(ok){award(30,15);fmsg.textContent='Correct! +30 XP';}else fmsg.textContent='Wrong answer';}function checkSpell(){if(spell.value.toLowerCase()==='elephant'){award(20,8);smsg.textContent='Correct! +20 XP';}else smsg.textContent='Try again';}render();</script></body></html>
